[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelops"
version = "1.4.0"
description = "Local engineering-model processing and delivery pipeline (proof of concept)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "fast-simplification>=0.2",
    "Flask>=3.0",
]

[project.scripts]
modelops = "modelops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelops = ["web/templates/*.html", "web/static/*", "web/static/**/*"]
